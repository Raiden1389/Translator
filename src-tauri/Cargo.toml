[package]
name = "raiden-ai-translator"
version = "2.9.4"
description = "A portable AI-powered web novel translator"
authors = ["Antigravity"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tiny_http = "0.12"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
local-ip-address = "0.6"
once_cell = "1.18"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# Optimized for FASTEST BUILD — UI desktop app doesn't need heavy optimization
# Trade-off: ~2-4MB larger binary, slightly less CPU optimization (unnoticeable for UI app)
[profile.release]
lto = false           # Skip LTO linking (saves 60-90s)
codegen-units = 32    # Max parallel code generation (was 16)
incremental = true    # Cache intermediate results
opt-level = 1         # Faster compile, still optimized enough for UI (was 2)
panic = "abort"       # Smaller binary
strip = true          # Remove debug symbols

# Dev mode: optimize dependencies but not our code (fast iteration + good dep performance)
[profile.dev.package."*"]
opt-level = 1         # Dependencies get basic optimization
debug = false         # No debug info for deps (saves ~200MB in target/)
